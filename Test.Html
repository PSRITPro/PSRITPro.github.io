<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Information</title>
    <style>
        /* Layout of the section */
        section {
            display: flex; /* Use Flexbox to arrange the columns */
            justify-content: space-between; /* Space between left and right columns */
            gap: 20px; /* Space between columns */
            padding: 20px;
            flex-wrap: wrap; /* Wrap content on smaller screens */
        }

        /* Left Column (for name, designation, and phone) */
        .left-column {
            flex: 1 1 45%; /* Take up 45% of the available space */
        }

        /* Right Column (for website links) */
        .right-column {
            flex: 1 1 45%; /* Take up 45% of the available space */
        }

        /* Styling the h2 headers */
        h2 {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        /* Styling for paragraphs */
        p {
            font-size: 16px;
            line-height: 1.5;
        }

        /* Ensure links are styled nicely */
        a {
            color: #0066cc;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Media Query for smaller screens (mobile devices) */
        @media (max-width: 768px) {
            section {
                flex-direction: column; /* Stack the columns vertically on small screens */
                align-items: center; /* Center align the content */
            }

            .left-column, .right-column {
                flex: 1 1 100%; /* Make each column take full width on mobile */
                margin-bottom: 20px; /* Add some space between sections */
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Professional Space</h1>
    </header>

    <section>
        <div class="left-column">
            <h2>Name</h2>
            <p>Siva Sankara Reddy Padala</p>

            <h2>Designation</h2>
            <p>Passionate Software Engineer</p>

            <h2>Phone</h2>
            <p>+123 456 7890</p>
        </div>

        <div class="right-column">
            <h2>Website Links</h2>
            <p><strong>Website:</strong> <a href="https://www.example.com" target="_blank">www.example.com</a></p>
            <p><strong>LinkedIn:</strong> <a href="https://www.linkedin.com/in/yourprofile" target="_blank">linkedin.com/in/yourprofile</a></p>
            <p><strong>GitHub:</strong> <a href="https://github.com/yourprofile" target="_blank">github.com/yourprofile</a></p>
        </div>
    </section>

    <footer>
        <p>&copy; 2024 Siva Sankara Reddy Padala</p>
    </footer>

</body>
</html>
